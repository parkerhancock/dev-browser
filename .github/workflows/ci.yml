name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: skills/dev-browser
        run: npm install

      - name: TypeScript check
        working-directory: skills/dev-browser
        run: npx tsc --noEmit

  test:
    name: Tests
    # Playwright 1.57 (under patchright) has no Chromium for ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: skills/dev-browser
        run: npm install

      - name: Install browsers
        working-directory: skills/dev-browser
        run: npx patchright install --with-deps chromium

      - name: Run tests
        working-directory: skills/dev-browser
        run: npm test

  mcp-server:
    name: MCP server
    # Playwright 1.57 (under patchright) has no Chromium for ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The MCP server imports the library's sources, which resolve their
      # dependencies from skills/dev-browser/node_modules
      - name: Install library dependencies
        working-directory: skills/dev-browser
        run: npm install

      - name: Install browsers
        working-directory: skills/dev-browser
        run: npx patchright install --with-deps chromium

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: TypeScript check
        working-directory: mcp-server
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: mcp-server
        run: npm test

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: TypeScript check
        working-directory: extension
        run: npx wxt prepare && npx tsc --noEmit

      - name: Run tests
        working-directory: extension
        run: npm run test:run

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check
