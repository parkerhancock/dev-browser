name: Release

# Push a tag matching the plugin version (v0.1.0 for satchel.yaml's 0.1.0) to
# publish a GitHub release with the Chrome extension attached. Users unzip it
# and load the folder unpacked in chrome://extensions.

on:
  push:
    tags: ["v*"]
  # Rerun the release for a tag that already exists (Actions > Release > Run workflow)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, like v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  extension:
    name: Extension release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the tag matches the plugin version
        id: version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG doesn't match the plugin version $version (satchel.yaml)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      # tsconfig.json extends the .wxt/ config that `wxt prepare` generates
      - name: Test
        working-directory: extension
        run: |
          npx wxt prepare
          npm run test:run

      - name: Build and zip
        working-directory: extension
        run: |
          npm run build
          # manifest.json at the top of the zip, so the unzipped folder loads as is
          (cd .output/chrome-mv3 && zip -r "$GITHUB_WORKSPACE/dev-browser-extension-${{ steps.version.outputs.version }}.zip" .)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: dev-browser-extension-${{ steps.version.outputs.version }}.zip
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP" --clobber
          else
            gh release create "$RELEASE_TAG" "$ZIP" --title "dev-browser $RELEASE_TAG" --generate-notes
          fi
